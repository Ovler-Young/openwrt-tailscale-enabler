name: Build and Release Smaller Tailscale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build_small_tailscale.yml

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.get_tag.outputs.latest_tag }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest non-pre Tailscale tag
        id: get_tag
        run: |
          git clone --bare https://github.com/tailscale/tailscale.git ts-bare
          LATEST_TAG=$(git -C ts-bare tag -l --sort=-v:refname | grep -v -E '(pre|rc)' | head -n 1)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already built
        id: check_tag
        run: |
          if git rev-parse ${{ steps.get_tag.outputs.latest_tag }} >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-tag
    if: needs.check-tag.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: arm
            goarm: "5"
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.22"

      - name: Clone and build Tailscale
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          TAG: ${{ needs.check-tag.outputs.latest_tag }}
        run: |
          git clone --depth 1 --branch $TAG https://github.com/tailscale/tailscale.git
          cd tailscale
          eval $(CGO_ENABLED=0 go run ./cmd/mkversion)
          ./build_dist.sh --extra-small ./cmd/tailscaled
          EXT=""
          [[ "$GOOS" == "windows" ]] && EXT=".exe"
          mv tailscaled ../tailscale-small-${GOOS}-${GOARCH}${GOARM:+-v$GOARM}${EXT}

      - name: Compress with UPX
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          cp tailscale-small-* tailscale-upx-temp
          upx --lzma --best tailscale-upx-temp
          mv tailscale-upx-temp tailscale-small-upx-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: tailscale-small-*

  release:
    needs: [check-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tag.outputs.latest_tag }}
          name: Tailscale ${{ needs.check-tag.outputs.latest_tag }}
          body: |
            Smaller Tailscale binaries.
            - Non-compressed versions for all platforms
            - UPX-compressed versions for Linux
          files: binaries/*
