name: Build and Release Smaller Tailscale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build_small_tailscale.yml

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: arm
            goarm: "5"
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest non-pre Tailscale tag
        id: get_tag
        run: |
          git clone https://github.com/tailscale/tailscale.git
          cd tailscale
          LATEST_TAG=$(git tag -l --sort=-v:refname | grep -v -E '(pre|rc)' | head -n 1)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already built
        id: check_tag
        run: |
          if git rev-parse ${{ steps.get_tag.outputs.latest_tag }} >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: '^1.22'

      - name: Build smaller Tailscale binary
        if: steps.check_tag.outputs.tag_exists == 'false'
        env:
          GOARM: ${{ matrix.goarm }}
        run: |
          set -eux
          cd tailscale
          git checkout ${{ steps.get_tag.outputs.latest_tag }}
          # Run mkversion without cross-compile env, then build with it
          eval $(CGO_ENABLED=0 go run ./cmd/mkversion)
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} ./build_dist.sh --extra-small ./cmd/tailscaled
          EXT=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"
          cp tailscaled${EXT} ../tailscale.combined${EXT}

      - name: Create non-compressed binary
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          EXT=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"
          SUFFIX="${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}"
          cp tailscale.combined${EXT} tailscale-small-${{ matrix.goos }}-${SUFFIX}-${{ steps.get_tag.outputs.latest_tag }}${EXT}

      - name: Install UPX
        if: steps.check_tag.outputs.tag_exists == 'false' && matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Compress with UPX
        if: steps.check_tag.outputs.tag_exists == 'false' && matrix.goos == 'linux'
        run: |
          SUFFIX="${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}"
          upx --lzma --best ./tailscale.combined
          mv tailscale.combined tailscale-small-upx-${{ matrix.goos }}-${SUFFIX}-${{ steps.get_tag.outputs.latest_tag }}

      - name: Upload artifacts
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: tailscale-small-*

  release:
    needs: check-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest non-pre Tailscale tag
        id: get_tag
        run: |
          git clone https://github.com/tailscale/tailscale.git
          cd tailscale
          LATEST_TAG=$(git tag -l --sort=-v:refname | grep -v -E '(pre|rc)' | head -n 1)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already built
        id: check_tag
        run: |
          if git rev-parse ${{ steps.get_tag.outputs.latest_tag }} >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.latest_tag }}
          name: Tailscale ${{ steps.get_tag.outputs.latest_tag }}
          body: |
            This release contains two versions of the Tailscale binary for each platform:
            - Non-compressed version
            - UPX-compressed version (Linux only)

            The UPX-compressed version is smaller but may trigger false positives in some security software.
          files: binaries/*
